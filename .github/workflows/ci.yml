name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install wget
        run: sudo apt-get update && sudo apt-get install -y wget
      - name: Install frontend dependencies
        run: npm ci
      - name: Build embedded frontend
        run: npm run build
      - name: Check Go formatting
        run: test -z "$(gofmt -l main.go assets.go pkg)"
      - name: Vet and test backend
        run: go vet ./... && go test -race -count=1 ./...
      - name: Build server
        run: go build -trimpath -o pagepack .
      - name: Install browser
        run: npm exec --yes --package=@playwright/test -- playwright install --with-deps chromium
      - name: Browser smoke test
        run: npm exec --yes --package=@playwright/test -- node scripts/frontend-smoke.cjs

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: cp .env.example .env && docker compose config --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: pagepack:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify container version
        run: docker run --rm pagepack:ci --version
      - name: Verify Compose services become healthy
        run: |
          docker tag pagepack:ci pagepack:1.0.0
          docker compose up --no-build --wait --wait-timeout 90
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop test containers
        if: always()
        run: docker compose down --volumes
