name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install wget
        run: sudo apt-get update && sudo apt-get install -y wget
      - name: Install frontend dependencies
        run: npm ci
      - name: Build embedded frontend
        run: npm run build
      - name: Check Go formatting
        run: test -z "$(gofmt -l main.go assets.go pkg)"
      - name: Vet and test backend
        run: go vet ./... && go test -race -count=1 ./...
      - name: Build server
        run: go build -trimpath -o pagepack .
      - name: Install browser
        run: npm exec --yes --package=@playwright/test -- playwright install --with-deps chromium
      - name: Browser smoke test
        run: npm exec --yes --package=@playwright/test -- node scripts/frontend-smoke.cjs
